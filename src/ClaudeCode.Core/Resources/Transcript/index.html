<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Local page only: no network resources, no inline event handlers, no remote content ever
     loaded here. Message content is untrusted (model/tool output) and is always run through
     DOMPurify before touching the DOM - see transcript.js renderMarkdown(). -->
<!-- No inline <style> element and no style= attribute exists on this page (all CSS is external
     and covered by 'self'); the runtime theming goes through CSSOM setProperty, which style-src
     does not govern - so 'unsafe-inline' would only widen what a sanitizer bug could reach.
     base-uri/form-action do not fall back to default-src and have to be denied explicitly. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';" />
<link rel="stylesheet" href="transcript.css" />
</head>
<body>
<div id="transcript" role="log" aria-live="polite"></div>
<!-- Vendored, pinned: markdown-it 14.3.2, DOMPurify 3.4.15, highlight.js 11.10.0. Each bundle
     keeps its own license banner with the same version; update by replacing the whole file. -->
<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="transcript-common.js"></script>
<script src="transcript.js"></script>
</body>
</html>
