name: CodeQL

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  schedule:
    # Weekly, Monday 04:23 UTC: catches newly published queries against unchanged code.
    - cron: '23 4 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode none: C# is extracted without compiling, so the Windows-only VSIX build is not needed.
          - language: csharp
            build-mode: none
          # Transcript renderer (WebView2 JavaScript).
          - language: javascript-typescript
            build-mode: none
          # GitHub Actions workflows themselves.
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
