name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # VSIX packaging (Microsoft.VSSDK.BuildTools' CreateVsixContainer/GeneratePkgDefFile) only runs on the
    # desktop CLR with Visual Studio's build components present, which windows-latest ships pre-installed.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release version selection
        shell: pwsh
        run: ./.github/tests/ReleaseVersion.Tests.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Restore
        run: dotnet restore ClaudeCodeVS.slnx --locked-mode

      - name: Build (Release)
        run: msbuild ClaudeCodeVS.slnx -t:Build -p:Configuration=Release -m -restore:false

      - name: Test - ClaudeCode.Acp.Tests
        run: dotnet test test/ClaudeCode.Acp.Tests/ClaudeCode.Acp.Tests.csproj -c Release --no-build --logger "trx;LogFileName=AcpTests.trx"

      - name: Test - ClaudeCode.Core.Tests
        run: dotnet test test/ClaudeCode.Core.Tests/ClaudeCode.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=CoreTests.trx"

      - name: Test - ClaudeCode.VsControl.Mcp.Tests
        run: dotnet test test/ClaudeCode.VsControl.Mcp.Tests/ClaudeCode.VsControl.Mcp.Tests.csproj -c Release --no-build --logger "trx;LogFileName=VsControlMcpTests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test/**/TestResults/*.trx

      - name: Upload VSIX (build artifact, not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ClaudeCode.Vsix-unsigned
          path: src/ClaudeCode.Vsix/bin/Release/net48/*.vsix
          if-no-files-found: error
