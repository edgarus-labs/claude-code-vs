name: CD

# A vX.Y.Z tag builds and tests the VSIX and drafts the GitHub release with it. Publishing to the
# Visual Studio Marketplace is a separate, manually started workflow (marketplace.yml).
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-vsix.yml

  # The VSIX and SHA256SUMS stay downloadable as the run's release-vsix artifact either way. Recovery
  # is "Re-run failed jobs": it reuses that artifact, so the released bits are the ones that were built
  # and tested.
  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-vsix
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ needs.build.outputs.version }}"
          # Published as a draft: the tag build is the candidate, a human reviews the notes and the
          # attached VSIX/checksum and presses Publish.
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.vsix
            release/SHA256SUMS
