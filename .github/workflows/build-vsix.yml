name: Build VSIX

# Shared by CD (a release tag) and Marketplace (a branch picked when the run is started): builds,
# tests and packages the VSIX stamped with the release version, and uploads it with its checksum as
# the run's release-vsix artifact for the caller's publishing job.
on:
  workflow_call:
    outputs:
      version:
        description: The release version the VSIX is stamped with (X.Y.Z).
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Test release version selection
        shell: pwsh
        run: ./.github/tests/ReleaseVersion.Tests.ps1

      - name: Test Marketplace publishing script
        shell: pwsh
        run: ./.github/tests/PublishMarketplace.Tests.ps1

      # A tag run releases that tag. A run started from a branch publishes the newest vX.Y.Z tag that
      # branch contains; Get-ReleaseVersion refuses it when a newer release tag exists anywhere.
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tags = @(git tag --list)
          if ($LASTEXITCODE -ne 0) { throw "Unable to enumerate release tags." }
          if ($env:REF_TYPE -eq 'tag') {
            $tag = $env:REF_NAME
          } else {
            $tag = git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*'
            if ($LASTEXITCODE -ne 0 -or -not $tag) { throw "Branch '$env:REF_NAME' contains no vX.Y.Z release tag." }
            git describe --tags --exact-match --match $tag 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) {
              "::warning::Branch '$env:REF_NAME' has commits after $tag; they are packaged as version $tag."
              $global:LASTEXITCODE = 0
            }
          }
          $version = & ./.github/scripts/Get-ReleaseVersion.ps1 -Tag $tag -ExistingTags $tags
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      # The VSIX manifest's Identity/@Version is what Visual Studio's Extensions & Updates dialog displays;
      # MSBuild's Version property only stamps the .NET assembly metadata, so both must be set from the tag.
      - name: Stamp release version into vsixmanifest
        shell: pwsh
        run: |
          $path = "src/ClaudeCode.Vsix/source.extension.vsixmanifest"
          $xml = [xml](Get-Content $path)
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("v", "http://schemas.microsoft.com/developer/vsx-schema/2011")
          $identity = $xml.SelectSingleNode("//v:Identity", $ns)
          $identity.SetAttribute("Version", "${{ steps.version.outputs.version }}")
          $xml.Save($path)

      - name: Restore
        run: dotnet restore ClaudeCodeVS.slnx --locked-mode

      - name: Build (Release, versioned)
        run: msbuild ClaudeCodeVS.slnx -t:Build -p:Configuration=Release -p:Version=${{ steps.version.outputs.version }} -m -restore:false

      - name: Test - ClaudeCode.Acp.Tests
        run: dotnet test test/ClaudeCode.Acp.Tests/ClaudeCode.Acp.Tests.csproj -c Release --no-build

      - name: Test - ClaudeCode.Core.Tests
        run: dotnet test test/ClaudeCode.Core.Tests/ClaudeCode.Core.Tests.csproj -c Release --no-build

      - name: Test - ClaudeCode.VsControl.Mcp.Tests
        run: dotnet test test/ClaudeCode.VsControl.Mcp.Tests/ClaudeCode.VsControl.Mcp.Tests.csproj -c Release --no-build

      - name: Locate VSIX
        id: vsix
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path "src/ClaudeCode.Vsix/bin/Release/net48" -Filter *.vsix -Recurse | Select-Object -First 1
          if (-not $vsix) { throw "No .vsix produced under src/ClaudeCode.Vsix/bin/Release/net48." }
          "path=$($vsix.FullName)" >> $env:GITHUB_OUTPUT

      - name: Generate checksum
        id: checksum
        shell: pwsh
        run: |
          $vsix = Get-Item "${{ steps.vsix.outputs.path }}"
          $hash = Get-FileHash -Path $vsix.FullName -Algorithm SHA256
          $checksumPath = Join-Path $vsix.DirectoryName "SHA256SUMS"
          "$($hash.Hash.ToLowerInvariant())  $($vsix.Name)" | Set-Content -Path $checksumPath -Encoding ascii
          "path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-vsix
          path: |
            ${{ steps.vsix.outputs.path }}
            ${{ steps.checksum.outputs.path }}
          if-no-files-found: error
